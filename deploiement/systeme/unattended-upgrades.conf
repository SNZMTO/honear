// Les mises à jour automatiques (installé dans /etc/apt/apt.conf.d/52miel-unattended-upgrades) : celles de sécurité de Debian, et
// Docker (les conteneurs tournent pendant qu'il se met à jour). Quand l'une d'elles demande un redémarrage (un noyau neuf), la
// machine redémarre à 5 h du matin, quand personne ne joue ; les vieux noyaux s'en vont.
Unattended-Upgrade::Origins-Pattern:: "origin=Docker,label=Docker CE";
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "05:00";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
