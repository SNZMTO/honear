# SSH, durci pour Miel d'oreilles (installé dans /etc/ssh/sshd_config.d/20-miel.conf) : on n'entre que par clé, et seulement en
# tant que debian ; trois essais par connexion ; rien d'autre que le terminal et les tunnels (VS Code s'en sert).
AllowUsers debian
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
