# Honear en ligne, sur le VPS : un conteneur, qui n'ouvre aucun port. Le frontal du VPS (Caddy, dans le dépôt « vps ») tient le
# HTTPS de honear.fr et lui passe tout par le réseau « honear », à l'adresse « honear:8080 ». Le jeu ne sort que vers Deezer et
# le serveur d'envoi des e-mails ; il lit les listes sur mesure du MCP de Honear sur le réseau interne « honear-listes ».
# Il n'a aucun droit : pas de capacités, rien à gagner en route, un système de fichiers en lecture seule, de la mémoire et des
# processus comptés.
#
# Posé dans /srv/honear par deploiement/mettre-en-ligne.sh, avec un .env à côté : VERSION (l'image, étiquetée à son commit),
# UID_DU_JEU et GID_DU_JEU (l'utilisateur honear, à qui appartiennent les comptes), DOMAINE.

name: honear

services:
  jeu:
    image: honear:${VERSION:?}
    restart: unless-stopped
    user: '${UID_DU_JEU:?}:${GID_DU_JEU:?}'
    # Le courrier des comptes : un fichier que seul root lit (deploiement/courrier.sh). Sans lui, les comptes sont fermés.
    env_file:
      - path: /etc/honear/courrier.env
        required: false
      # La clé de la page des statistiques : un fichier que seul root lit, que la mise en ligne crée. Sans lui, la page est fermée.
      - path: /etc/honear/statistiques.env
        required: false
    environment:
      ORIGINES: https://${DOMAINE:?}
      SITE: https://${DOMAINE:?}
      # Le MCP de Honear (mcp.honear.fr) sert les listes sur ce réseau ; tant qu'il n'y est pas, elles sont introuvables.
      LISTES: http://honear-mcp:8791
      # Le frontal (Caddy) est seul à joindre le jeu : l'adresse d'un navigateur est la dernière qu'il ajoute à X-Forwarded-For.
      # Sans RELAIS, le jeu prendrait celle du frontal pour tous, et ses limites par adresse vaudraient pour tout le site.
      RELAIS: '1'
      # Le diagnostic des pages (?diagnostic) n'écrit au journal que si on l'ouvre, le temps d'un essai (voir HEBERGEMENT.md) :
      # sudo env DIAGNOSTIC=1 docker compose --project-directory /srv/honear up -d. Une mise en ligne le referme.
      DIAGNOSTIC: ${DIAGNOSTIC:-}
    # Les comptes et les statistiques : le seul dossier où le jeu écrit.
    volumes:
      - /var/lib/honear:/donnees
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    # Une mise en ligne arrête le jeu : il prévient les téléphones, qui se rebrancheront.
    stop_grace_period: 5s
    networks:
      honear:
        aliases: [honear]
      honear-listes: {}

# Le réseau du jeu, que le frontal rejoint ; et celui des listes, que le MCP rejoint, d'où l'on ne sort pas.
networks:
  honear:
    name: honear
  honear-listes:
    name: honear-listes
    internal: true
