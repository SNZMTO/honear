# Le jeu en ligne, sur le VPS : deux conteneurs. Caddy est le seul à écouter le monde (80 et 443) : il tient le HTTPS des domaines
# et passe tout au jeu. Le jeu n'ouvre aucun port : on ne le joint que par Caddy. Il sort seulement vers Deezer, Spotify et le
# serveur d'envoi des e-mails. Aucun des deux n'a de droits : pas de capacités (Caddy garde seulement celle d'écouter sur 80 et 443),
# rien à gagner en route, un système de fichiers en lecture seule.
#
# Posé dans /srv/miel-doreilles par deploiement/mettre-en-ligne.sh, avec un .env à côté : VERSION (l'image du jeu, étiquetée à son
# commit), UID_DU_JEU et GID_DU_JEU (l'utilisateur miel, à qui appartiennent les comptes), DOMAINE et AUTRE_DOMAINE.

name: miel-doreilles

services:
  jeu:
    image: miel-doreilles:${VERSION:?}
    restart: unless-stopped
    user: '${UID_DU_JEU:?}:${GID_DU_JEU:?}'
    # Le courrier des comptes : un fichier que seul root écrit (deploiement/courrier.sh). Sans lui, les comptes sont fermés.
    env_file:
      - path: /etc/miel-doreilles/courrier.env
        required: false
    environment:
      ORIGINES: https://${DOMAINE:?}
      SITE: https://${DOMAINE:?}
    # Les comptes : le seul dossier où le jeu écrit.
    volumes:
      - /var/lib/miel-doreilles:/donnees
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    # Une mise en ligne arrête le jeu : il prévient les téléphones, qui se rebrancheront.
    stop_grace_period: 5s
    networks: [miel]

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      jeu:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAINE: ${DOMAINE:?}
      AUTRE_DOMAINE: ${AUTRE_DOMAINE:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-donnees:/data
      - caddy-reglages:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    networks: [miel]

# Les certificats de Caddy, gardés d'une mise en ligne à l'autre.
volumes:
  caddy-donnees:
  caddy-reglages:

networks:
  miel:
